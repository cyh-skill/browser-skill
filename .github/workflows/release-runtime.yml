name: Release Rust Runtime

on:
  push:
    tags: ['runtime-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: browser-skill-linux-x86_64
            binary: target/release/browser-skill
          - os: macos-15-arm64
            artifact: browser-skill-macos-aarch64
            binary: target/release/browser-skill
          - os: macos-15
            artifact: browser-skill-macos-x86_64
            binary: target/release/browser-skill
          - os: windows-latest
            artifact: browser-skill-windows-x86_64.exe
            binary: target/release/browser-skill.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - shell: bash
        run: |
          cp '${{ matrix.binary }}' '${{ matrix.artifact }}'
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum '${{ matrix.artifact }}' > '${{ matrix.artifact }}.sha256'
          else
            shasum -a 256 '${{ matrix.artifact }}' > '${{ matrix.artifact }}.sha256'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
