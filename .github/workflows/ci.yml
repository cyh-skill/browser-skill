name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    name: Skill and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate Codex Skill
        uses: cyh-skill/.github/actions/validate-skill@ed44478f6dd48649dd1b2ee7dd219d4af7699d8b # organization baseline
      - name: Check Codex and Claude Code metadata
        run: |
          ruby -e '
            require "yaml"
            data = YAML.safe_load_file(ARGV.fetch(0), permitted_classes: [], aliases: false)
            interface = data.fetch("interface")
            %w[display_name short_description default_prompt].each do |key|
              value = interface.fetch(key)
              abort "invalid interface.#{key}" unless value.is_a?(String) && !value.empty?
            end
            abort "default_prompt must mention $cyh-browser-skill" unless interface.fetch("default_prompt").include?("$cyh-browser-skill")
          ' agents/openai.yaml
          jq -e '.name == "browser-skill" and .version == "2.0.0" and .skills == ["./"]' \
            .claude-plugin/plugin.json >/dev/null
          jq -e '.name == "browser-skill" and .metadata.version == "2.0.0" and any(.plugins[]; .name == "browser-skill" and .source == "./")' \
            .claude-plugin/marketplace.json >/dev/null
          jq empty evals/evals.json extension/manifest.json
      - name: Check JavaScript
        run: |
          node --check extension/background.js
          node --check runtime/observe.js
      - name: Check shell scripts
        run: |
          sh -n install.sh tests/test_install.sh
          shellcheck install.sh tests/test_install.sh
      - name: Test offline installer paths
        run: tests/test_install.sh

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
